name: Zomato AnyPoint Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    env:
      ANYPOINT_PASSWORD: ${{ secrets.ANYPOINT_PASSWORD }}
      ANYPOINT_PASSWORD_PROPERTY: anypoint.password
      ANYPOINT_USERNAME: ${{ secrets.ANYPOINT_USERNAME }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate credentials
        run: |
          test -n "${ANYPOINT_USERNAME}"
          test -n "${ANYPOINT_PASSWORD}"

      - name: Unit test
        run: mvn -B clean test

      - name: Deploy standalone
        run: mvn -B deploy -P standalone

      - name: Deploy to AnyPoint
        run: |
          mvn -B deploy -P arm \
            -Darm.target.name=local-4.0.0-ee \
            -Danypoint.username="${ANYPOINT_USERNAME}" \
            -D"${ANYPOINT_PASSWORD_PROPERTY}"="${ANYPOINT_PASSWORD}"

      - name: Deploy to CloudHub
        run: |
          mvn -B deploy -P cloudhub \
            -Dmule.version=4.0.0 \
            -Danypoint.username="${ANYPOINT_USERNAME}" \
            -D"${ANYPOINT_PASSWORD_PROPERTY}"="${ANYPOINT_PASSWORD}"
